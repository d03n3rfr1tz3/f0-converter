begin remote

  name  Example_TV
  bits            16
  flags SPACE_ENC|CONST_LENGTH
  eps             30
  aeps           100
  frequency    38000
  duty_cycle      33

  header        9000  4500
  one            560  1690
  zero           560   560
  ptrail         560
  repeat        9000  2250
  pre_data_bits    16
  pre_data     0x08F7
  gap          108000

      begin codes
          KEY_POWER                0x10EF
          KEY_VOL_UP               0x40BF
          KEY_VOL_DN               0xC03F
      end codes

end remote

